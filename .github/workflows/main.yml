name: Build/release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --max-old-space-size=6144

    strategy:
      matrix:
        # os: [windows-latest, macos-latest, ubuntu-latest]
        os: [macos-15]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Install Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.18.0
          cache: 'yarn'

      - name: Mitigate hdiutil flakiness
        run: |
          defaults write com.apple.frameworks.diskimages skip-verify -bool true
          defaults write com.apple.frameworks.diskimages skip-verify-locked -bool true
          defaults write com.apple.frameworks.diskimages skip-verify-remote -bool true

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build app
        run: yarn build

      - name: Package macOS dmg
        timeout-minutes: 20
        run: |
          ok=0
          for i in 1 2 3; do
            echo "=== electron-builder attempt $i ==="
            if npx electron-builder --mac --x64 --publish never; then
              ok=1
              break
            fi
            echo "attempt $i failed, force-detaching leftover disk images"
            for d in $(hdiutil info | grep -oE '/dev/disk[0-9]+' | sort -u); do
              hdiutil detach -force "$d" || true
            done
            sleep 15
          done
          [ "$ok" = "1" ]

      - name: Upload Artifact (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: fmplayer-mac
          path: ./dist/*-mac-*.dmg
          if-no-files-found: ignore

      - name: Upload Artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: fmplayer-win
          path: ./dist/*-win-*.exe
          if-no-files-found: ignore

      - name: Upload Artifact (Linux AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: fmplayer-linux-appimage
          path: ./dist/*.AppImage
          if-no-files-found: ignore

      - name: Upload Artifact (Linux deb)
        uses: actions/upload-artifact@v4
        with:
          name: fmplayer-linux-deb
          path: ./dist/*.deb
          if-no-files-found: ignore

      - name: Upload Artifact (Linux rpm)
        uses: actions/upload-artifact@v4
        with:
          name: fmplayer-linux-rpm
          path: ./dist/*.rpm
          if-no-files-found: ignore
